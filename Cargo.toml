[package]
name = "hmtv"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
mpvipc = "1.3"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
